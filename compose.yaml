name: morethis
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: morethis
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: morethis
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morethis -d morethis"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
